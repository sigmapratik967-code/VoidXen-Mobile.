
name: VoidXen Mobile APK Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract source ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP"
          mkdir source
          unzip -q "$ZIP" -d source

      - name: Fix JVM targets and build APK
        run: |
          PROJECT=$(find source -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$PROJECT"

          python3 - "$PROJECT/app/build.gradle.kts" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          marker = "    defaultConfig {"
          patch = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

          """
          if "kotlinOptions {" not in s:
              s = s.replace(marker, patch + marker, 1)
          open(p, "w").write(s)
          PY

          gradle -p "$PROJECT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidXen-Mobile-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          
